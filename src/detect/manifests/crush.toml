id = "crush"
version = "2026.08.18.1"
min_engine_version = 1
updated_at = "2026-08-18T00:00:00Z"
aliases = ["charm", "herdr:crush"]

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
contains = ["Permission Required"]
any = [
  { contains = ["Allow"] },
  { contains = ["Allow for Session"] },
]

[[rules]]
id = "quit_confirmation"
state = "blocked"
priority = 250
region = "whole_recent"
visible_blocker = true
contains = ["Are you sure you want to quit?"]
any = [
  { contains = ["Yep!"] },
  { contains = ["Nope"] },
]

[[rules]]
id = "working_placeholders"
state = "working"
priority = 200
region = "whole_recent"
visible_working = true
any = [
  { contains = ["Working..."] },
  { contains = ["Working!"] },
  { contains = ["Processing..."] },
  { contains = ["Thinking..."] },
  { contains = ["Brrrrr"] },
  { contains = ["Prrrrrrrr"] },
]

[[rules]]
id = "cancel_working"
state = "working"
priority = 150
region = "whole_recent"
visible_working = true
contains = ["press again to cancel"]

[[rules]]
id = "ready_idle"
state = "idle"
priority = 100
region = "whole_recent"
visible_idle = true
any = [
  { contains = ["Ready..."] },
  { contains = ["Ready for instructions"] },
]

[[rules]]
id = "prompt_idle"
state = "idle"
priority = 50
region = "bottom_non_empty_lines(3)"
visible_idle = true
line_regex = ['^\s{2}> ']